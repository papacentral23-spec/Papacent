<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIRDIO LISTENER V7</title><script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script><style>body{background:#0a0a0f;color:#fff;font-family:sans-serif;text-align:center;padding:20px}header{border-bottom:3px solid #d4af37;padding:12px}.card{background:#111;border:2px solid #d4af37;border-radius:16px;padding:20px;margin:20px 0}#np{font-size:24px;color:#d4af37;font-weight:bold}.vu{display:flex;gap:2px;height:40px;background:#000;padding:4px}.b{flex:1;background:#d4af37;height:10%}</style></head><body>
<header>🔥 SIRDIO LISTENER V7 - ABBEY ROAD | <span id="cs">🟡</span> 👥<b id="lc">1</b></header>
<div class="vu" id="vu"></div>
<div class="card">
<div style="color:#aaa">LIVE NOW FROM KUMASI</div>
<div id="np">Waiting for DJ...</div>
<div style="margin:15px 0">🎧 Abbey Road warmed radio!</div>
<button onclick="join()" style="padding:14px 24px;background:#d4af37;color:#000;border:0;border-radius:10px;font-weight:bold">👋 JOIN + SHOW COUNT</button>
</div>
<script>
let vu=document.getElementById('vu');for(let i=0;i<20;i++){let d=document.createElement('div');d.className='b';vu.appendChild(d);}setInterval(()=>{for(let c of vu.children)c.style.height=(Math.random()*80+10)+'%';},120);
let brokers=['wss://broker.hivemq.com:8884/mqtt','wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8000/mqtt'],idx=0,client=null;
function tryConn(){if(idx>=brokers.length){cs.textContent='🔴 Offline';return;}let c=mqtt.connect(brokers[idx],{keepalive:30,connectTimeout:5000});c.on('connect',()=>{client=c;cs.textContent='🟢 LIVE';c.subscribe('sirdio/host/nowplaying');c.subscribe('sirdio/listener/join');c.publish('sirdio/listener/join','1');c.on('message',(t,m)=>{if(t.includes('nowplaying'))np.textContent=m.toString();if(t.includes('join'))lc.textContent=parseInt(lc.textContent)+1;});});c.on('error',()=>{idx++;tryConn();});c.on('close',()=>{if(!client||!client.connected){idx++;tryConn();}});}
tryConn();function join(){if(client)client.publish('sirdio/listener/join','1');}
</script></body></html>
