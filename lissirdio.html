<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIRDIO LISTEN</title><style>*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:system-ui;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}.dot{width:14px;height:14px;background:red;border-radius:50%;display:inline-block;animation:b .8s infinite}@keyframes b{50%{opacity:.2}}.play{width:140px;height:140px;border-radius:50%;background:#B9FF00;border:0;font-size:60px;color:#000;box-shadow:0 0 50px #B9FF00;cursor:pointer;transition:.2s}.play:active{transform:scale(.95)}.art{width:200px;height:200px;border-radius:24px;background:linear-gradient(135deg,#B9FF00,#00ff88);display:flex;align-items:center;justify-content:center;font-size:80px;margin:20px auto;box-shadow:0 0 40px #B9FF0088}</style></head><body>
<div style="font-size:12px;opacity:.7;letter-spacing:2px"><span class=dot></span> SIRDIO LIVE • KUMASI</div>
<div class=art>🎵</div>
<h2 id=np style="margin:10px 0 4px">SIRDIO RADIO</h2>
<div id=sub style="opacity:.5;font-size:12px;margin-bottom:24px">Live Nonstop Music</div>
<button class=play id=pb onclick="tog()">▶</button>
<div style="margin-top:18px;font-size:11px;opacity:.4">Tap to Listen • One Button Only</div>
<div id=tm style="margin-top:8px;font-size:10px;opacity:.3">00:00:00</div>
<audio id=au></audio>
<script>
let au=document.getElementById('au'),isP=false;
function tog(){if(!isP){au.src='https://stream.zeno.fm/0r0xa8v18k8uv';au.play().catch(()=>{document.getElementById('sub').textContent='🔴 Host is OFF - Waiting...'});document.getElementById('pb').textContent='⏸';isP=true;let t=localStorage.getItem('sirdio_now_playing');if(t)document.getElementById('np').textContent=t;}else{au.pause();document.getElementById('pb').textContent='▶';isP=false;}}
setInterval(()=>{let n=localStorage.getItem('sirdio_now_playing');if(n)document.getElementById('np').textContent=n;document.getElementById('tm').textContent=new Date().toLocaleTimeString()},1000);
</script></body></html>
