<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIRDIO V7 - ABBEY ROAD</title><script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script><style>body{background:#0a0a0f;color:#fff;font-family:sans-serif;margin:0;padding:8px}header{background:#111;padding:12px;display:flex;justify-content:space-between;border-bottom:3px solid #d4af37;position:sticky;top:0}#a{display:none;position:fixed;top:0;left:0;right:0;background:#d4af37;color:#000;padding:15px;z-index:999;text-align:center;font-weight:bold}button{padding:12px 10px;margin:4px;background:#222;color:#fff;border:1px solid #555;border-radius:8px;font-weight:bold}button.active{background:#d4af37;color:#000}.vu{display:flex;gap:2px;height:55px;background:#000;padding:4px;margin:6px 0;border:1px solid #d4af37}.b{flex:1;background:linear-gradient(to top,#d4af37,#fff8dc);height:10%}#pl{max-height:35vh;overflow:auto;background:#111;padding:5px}.song{padding:10px;border-bottom:1px solid #222}.song.active{background:#d4af37;color:#000}.abbey-panel{background:linear-gradient(135deg,#1a1a1a,#2a2110);border:2px solid #d4af37;border-radius:12px;padding:10px;margin:8px 0}</style></head><body>
<div id="a">🔴 <span id="gn"></span> <button onclick="a.style.display='none';try{client.publish('sirdio/host/guest','YES')}catch(e){}">ACCEPT</button> <button onclick="a.style.display='none'">REJECT</button></div>
<header><div>🔥 SIRDIO <span style="color:#d4af37">ABBEY ROAD V7</span></div><div><span id="cs">🟡 Loading...</span> | 👥<b id="lc">0</b></div></header>
<div class="vu" id="vu"></div>
<audio id="p" controls style="width:100%"></audio>
<div style="text-align:center">
<input type="file" id="f" accept="audio/*" multiple hidden>
<button onclick="f.click()">📁 ADD MP3</button>
<button onclick="pp()">⏯️ PLAY/PAUSE</button>
<button onclick="nt()">⏭️ NEXT</button>
</div>
<div class="abbey-panel">
<div style="color:#d4af37;font-weight:bold;text-align:center">🎙️ ABBEY ROAD ANALOGUE - TG + J37 + RS124</div>
<div style="text-align:center;margin-top:6px">
<button id="abbeyBtn" onclick="toggleAbbey()">🎛️ ABBEY ROAD WARM: OFF</button>
<button id="micBtn" onclick="tm()">🎤 MIC OFF</button>
</div>
<div style="display:flex;justify-content:center;margin-top:8px;flex-wrap:wrap">
<div style="text-align:center;margin:0 6px"><label style="font-size:10px;color:#d4af37">INPUT GAIN</label><br><input type="range" id="inGain" min="0" max="2" step="0.05" value="1.2" style="width:70px"></div>
<div style="text-align:center;margin:0 6px"><label style="font-size:10px;color:#d4af37">TAPE SAT</label><br><input type="range" id="sat" min="0" max="100" value="35" style="width:70px"></div>
<div style="text-align:center;margin:0 6px"><label style="font-size:10px;color:#d4af37">SILK</label><br><input type="range" id="silk" min="0" max="100" value="75" style="width:70px"></div>
<div style="text-align:center;margin:0 6px"><label style="font-size:10px;color:#d4af37">GLUE</label><br><input type="range" id="glue" min="0" max="100" value="60" style="width:70px"></div>
</div>
</div>
<div id="pl"></div>
<div style="padding:10px;background:#111;margin-top:6px;border-left:3px solid #d4af37">Now: <b id="np" style="color:#d4af37">Nothing</b><br><small style="color:#0f0">✅ Songs saved forever | 🎙️ Abbey Road on mic</small></div>
<script>
let pl=JSON.parse(localStorage.getItem('sirdio_pl_v7')||'[]'),ci=0,ms=null,client=null,audioCtx=null,abbeyOn=false,sourceNode=null,inputGain=null,tapeSat=null,silkFilter=null,glueComp=null,outputGain=null;
const p=document.getElementById('p'),vu=document.getElementById('vu'),plDiv=document.getElementById('pl');
for(let i=0;i<20;i++){let d=document.createElement('div');d.className='b';vu.appendChild(d);}
setInterval(()=>{if(!p.paused)for(let c of vu.children)c.style.height=(Math.random()*85+8)+'%';},100);
function save(){localStorage.setItem('sirdio_pl_v7',JSON.stringify(pl.map(x=>({n:x.n}))));}
function render(){plDiv.innerHTML='';pl.forEach((s,i)=>{let d=document.createElement('div');d.className='song'+(i==ci?' active':'');d.textContent='🎵 '+s.n;d.onclick=()=>{ci=i;play();};plDiv.appendChild(d);});}
function play(){if(!pl[ci])return;if(pl[ci].u){p.src=pl[ci].u;}p.play();document.getElementById('np').textContent=pl[ci].n;render();}
function pp(){if(p.paused)p.play();else p.pause();}function nt(){ci++;if(ci>=pl.length)ci=0;play();}
f.onchange=e=>{for(let file of e.target.files){let u=URL.createObjectURL(file);pl.push({n:file.name,u});}render();save();};
function initAudioChain(stream){
if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
if(sourceNode)try{sourceNode.disconnect();}catch(e){}
sourceNode=audioCtx.createMediaStreamSource(stream);
inputGain=audioCtx.createGain();tapeSat=audioCtx.createWaveShaper();silkFilter=audioCtx.createBiquadFilter();glueComp=audioCtx.createDynamicsCompressor();outputGain=audioCtx.createGain();
inputGain.gain.value=parseFloat(document.getElementById('inGain').value);
function makeSat(amount){let k=amount*5,n=44100,curve=new Float32Array(n);for(let i=0;i<n;i++){let x=i*2/n-1;curve[i]=(3+k)*x*20*Math.PI/180/(Math.PI+k*Math.abs(x));}return curve;}
tapeSat.curve=makeSat(parseFloat(document.getElementById('sat').value)/100);tapeSat.oversample='4x';
silkFilter.type='lowpass';silkFilter.frequency.value=12000-(parseFloat(document.getElementById('silk').value)*30);silkFilter.Q.value=0.7;
glueComp.threshold.value=-18;glueComp.knee.value=30;glueComp.ratio.value=4+(parseFloat(document.getElementById('glue').value)/25);glueComp.attack.value=0.03;glueComp.release.value=0.35;
outputGain.gain.value=1.2;
sourceNode.connect(inputGain);inputGain.connect(tapeSat);tapeSat.connect(silkFilter);silkFilter.connect(glueComp);glueComp.connect(outputGain);
if(abbeyOn)outputGain.connect(audioCtx.destination);
document.getElementById('inGain').oninput=e=>{if(inputGain)inputGain.gain.value=parseFloat(e.target.value);};
document.getElementById('sat').oninput=e=>{if(tapeSat)tapeSat.curve=makeSat(parseFloat(e.target.value)/100);};
document.getElementById('silk').oninput=e=>{if(silkFilter)silkFilter.frequency.value=12000-(parseFloat(e.target.value)*30);};
document.getElementById('glue').oninput=e=>{if(glueComp)glueComp.ratio.value=4+(parseFloat(e.target.value)/25);};
}
function toggleAbbey(){abbeyOn=!abbeyOn;let b=document.getElementById('abbeyBtn');if(abbeyOn){b.textContent='🎛️ ABBEY ROAD WARM: ON ✨';b.classList.add('active');if(outputGain)outputGain.connect(audioCtx.destination);}else{b.textContent='🎛️ ABBEY ROAD WARM: OFF';b.classList.remove('active');if(outputGain)try{outputGain.disconnect();}catch(e){}}}
async function tm(){let b=document.getElementById('micBtn');if(ms){ms.getTracks().forEach(t=>t.stop());ms=null;if(outputGain)try{outputGain.disconnect();}catch(e){}b.textContent='🎤 MIC OFF';b.classList.remove('active');return;}try{ms=await navigator.mediaDevices.getUserMedia({audio:true,echoCancellation:false,autoGainControl:false,noiseSuppression:false});initAudioChain(ms);b.textContent='🔴 MIC ON - ABBEY ROAD';b.classList.add('active');if(!abbeyOn)toggleAbbey();}catch(err){alert('Mic error: '+err.message);}}
let brokers=['wss://broker.hivemq.com:8884/mqtt','wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8000/mqtt'];let idx=0;
function tryConn(){if(idx>=brokers.length){document.getElementById('cs').textContent='🔴 Offline - music works';return;}let url=brokers[idx];document.getElementById('cs').textContent='🟡 Try '+(idx+1)+'/3';let c=mqtt.connect(url,{keepalive:30,connectTimeout:5000});c.on('connect',()=>{client=c;document.getElementById('cs').textContent='🟢 CONNECTED';c.subscribe('sirdio/guest/request');c.subscribe('sirdio/listener/join');c.on('message',(t,m)=>{let v=m.toString();if(t.includes('guest')){document.getElementById('gn').textContent=v;document.getElementById('a').style.display='block';}if(t.includes('listener')){document.getElementById('lc').textContent=parseInt(document.getElementById('lc').textContent)+1;}});});c.on('error',()=>{idx++;tryConn();});c.on('close',()=>{if(!client||!client.connected){idx++;tryConn();}});}
tryConn();render();p.onended=()=>nt();
</script></body></html>
