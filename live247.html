<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PAPACENTRAL PLAY 24/7</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#08080f;color:#fff;font-family:system-ui;max-width:420px;margin:0 auto}.top{background:#B9FF00;color:#000;text-align:center;padding:8px;font-weight:900;font-size:11px}.card{background:#12121f;border:1px solid #222;border-radius:20px;padding:18px;margin:12px}.play{width:68px;height:68px;background:#fff;border-radius:50%;border:none;font-size:26px}</style></head><body>
<div class="top">● LIVE 24/7 - PAPACENTRAL - KUMASI</div>
<div style="padding:14px;display:flex;justify-content:space-between"><b>PAPACENT <span style="color:#B9FF00">PLAY</span></b><span style="background:red;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:900">● LIVE</span></div>
<div class="card" style="text-align:center"><div style="width:130px;height:130px;background:linear-gradient(135deg,#B9FF00,#00ff88);border-radius:24px;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:50px">📻</div>
<h1 style="font-size:30px;font-weight:900;margin-top:12px">Kumasi Morning<br>Show</h1><p style="color:#666;font-size:12px">Central Mart • LIVE</p>
<div style="background:#000;border-radius:99px;padding:8px 14px;display:flex;align-items:center;gap:12px;margin-top:16px"><button id="pb" onclick="tog()" class="play"><i class="fa-solid fa-play"></i></button><div style="text-align:left"><div id="st" style="font-weight:800;font-size:13px">Tap to Play</div><div style="color:#666;font-size:11px">24/7 Loud</div></div></div><audio id="a" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio></div>
<div class="card"><div style="font-size:11px;color:#666;font-weight:900">LIVE CHAT</div><div id="chat" style="margin-top:8px;font-size:13px"><div><b style="color:#B9FF00">Kofi:</b> Fire! 🔥</div></div><div style="display:flex;gap:8px;margin-top:10px"><input id="ci" placeholder="Chat..." style="flex:1;background:#000;border:1px solid #333;border-radius:99px;padding:10px;color:#fff"><button onclick="send()" style="background:#fff;color:#000;border:none;padding:10px 16px;border-radius:99px;font-weight:800">Send</button></div></div>
<script>let p=false;function tog(){let a=document.getElementById('a'),b=document.getElementById('pb'),s=document.getElementById('st');if(!p){a.play();b.innerHTML='<i class="fa-solid fa-pause"></i>';s.innerText='Playing Live';p=true}else{a.pause();b.innerHTML='<i class="fa-solid fa-play"></i>';s.innerText='Tap to Play';p=false}}function send(){let i=document.getElementById('ci');if(!i.value)return;document.getElementById('chat').innerHTML+='<div><b style="color:#B9FF00">You:</b> '+i.value+'</div>';i.value='';}</script></body></html>
