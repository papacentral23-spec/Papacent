<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>GUEST MIC - SIRDIO</title><style>*{box-sizing:border-box}body{margin:0;background:#0d1a0d;color:#c8f5c8;font-family:monospace;display:flex;flex-direction:column;height:100vh}.top{padding:12px;background:#000;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #00ff88}.light{width:22px;height:22px;border-radius:50%;background:#333;transition:.3s}.light.req{background:orange;box-shadow:0 0 15px orange;animation:b 0.5s infinite}.light.on{background:#00ff88;box-shadow:0 0 20px #00ff88;animation:b 0.5s infinite}@keyframes b{50%{opacity:.3}}.main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:16px}.mic-card{background:#111;border:2px solid #333;border-radius:20px;padding:20px;width:100%;max-width:360px;text-align:center}.mic-card.live{border-color:#00ff88;box-shadow:0 0 30px #00ff8822}.fader{height:140px;width:50px;background:#000;border-radius:10px;margin:12px auto;position:relative;border:2px solid #444}.cap{position:absolute;left:3px;right:3px;height:30px;background:linear-gradient(#7fffc7,#0f8);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;color:#000;cursor:grab;touch-action:none;bottom:70px}.btn{padding:14px 24px;border-radius:99px;border:0;font-weight:900;font-size:14px;cursor:pointer;width:100%}.btn-mic{background:#00ff88;color:#000}.btn-mic.off{background:#333;color:#777}.btn-req{background:#ffaa00;color:#000;animation:pulse 1s infinite}.btn-req.sent{background:#333;color:#ffaa00;animation:none}@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.05)}}#vumeter{height:10px;background:#000;border-radius:5px;overflow:hidden;border:1px solid #333;margin-top:10px}#vu{height:100%;width:0%;background:linear-gradient(90deg,#0f8,#ff0,#f00);transition:width 0.1s}</style></head><body>
<div class=top><div>🎤 GUEST MIC</div><div style="display:flex;gap:8px;align-items:center"><span id=t>00:00:00</span><div id=al class=light></div><span id=st style="font-size:10px;color:#888">OFFLINE</span></div></div>
<div id=msg style="background:#ffaa00;color:#000;padding:10px;text-align:center;font-weight:900;display:none">⏳ WAITING FOR HOST TO ALLOW...</div>
<div id=liveMsg style="background:#00ff88;color:#000;padding:12px;text-align:center;font-weight:900;font-size:16px;display:none">🔴 YOU ARE LIVE ON AIR!</div>
<div class=main>
<div class="mic-card" id=card>
<h2 style="margin:0 0 10px;color:#00ff88">GUEST STUDIO</h2>
<div style="font-size:11px;opacity:.6;margin-bottom:12px">Tap mic to talk - Host must ALLOW</div>
<div class=fader id=fader><div class=cap id=cap>80%</div></div>
<div id=vumeter><div id=vu></div></div>
<div style="margin-top:16px;display:flex;flex-direction:column;gap:10px">
<button id=micBtn class="btn btn-mic off" onclick="toggleMic()">🎤 MIC OFF - TAP TO ON</button>
<button id=reqBtn class="btn btn-req" onclick="requestAir()">📡 REQUEST TO GO ON AIR</button>
<button class="btn" style="background:#222;color:#aaa;font-size:11px" onclick="leaveAir()">LEAVE / MUTE</button>
</div>
<div style="margin-top:12px;font-size:9px;opacity:.5">Status: <span id=det>Mic off - Request air to join host</span></div>
</div>
</div>
<script>
let ac,micStream,micSource,gainNode,analyser,micOn=false,requestSent=false,allowed=false;
function iac(){if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();gainNode=ac.createGain();gainNode.gain.value=0.8;analyser=ac.createAnalyser();analyser.fftSize=256;gainNode.connect(ac.destination);}}
window.toggleMic=async function(){iac();let btn=document.getElementById('micBtn'),det=document.getElementById('det'),card=document.getElementById('card');if(!micOn){try{micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});micSource=ac.createMediaStreamSource(micStream);micSource.connect(gainNode);micSource.connect(analyser);micOn=true;btn.textContent='🔴 MIC LIVE - TAP TO OFF';btn.classList.remove('off');card.classList.add('live');det.textContent='Mic ON - Now Request Air';vuLoop();}catch(e){alert('Allow mic! Must use HTTPS link:\\nhttps://papacentral23-spec.github.io/Papacent/guest.html');}}else{stopMic();}};
function stopMic(){if(micStream)micStream.getTracks().forEach(t=>t.stop());micOn=false;document.getElementById('micBtn').textContent='🎤 MIC OFF - TAP TO ON';document.getElementById('micBtn').classList.add('off');document.getElementById('card').classList.remove('live');document.getElementById('det').textContent='Mic off';document.getElementById('vu').style.width='0%';}
function vuLoop(){if(!micOn)return;let data=new Uint8Array(analyser.frequencyBinCount);analyser.getByteFrequencyData(data);let avg=data.reduce((a,b)=>a+b,0)/data.length;let pct=Math.min(100,avg*1.5);document.getElementById('vu').style.width=pct+'%';requestAnimationFrame(vuLoop);}
window.requestAir=function(){localStorage.setItem('sirdio_guest_want_air','1');localStorage.setItem('sirdio_guest_time',Date.now());requestSent=true;document.getElementById('reqBtn').textContent='⏳ REQUEST SENT - WAITING HOST';document.getElementById('reqBtn').classList.add('sent');document.getElementById('msg').style.display='block';document.getElementById('al').classList.add('req');document.getElementById('st').textContent='REQUESTED';document.getElementById('det').textContent='Request sent - Host will ALLOW you';setTimeout(()=>{if(!allowed){let c=confirm('Host not responding? You can still talk locally and host will hear if same WiFi tab open');}},5000);};
window.leaveAir=function(){localStorage.removeItem('sirdio_guest_want_air');localStorage.removeItem('sirdio_guest_allowed');requestSent=false;allowed=false;document.getElementById('reqBtn').textContent='📡 REQUEST TO GO ON AIR';document.getElementById('reqBtn').classList.remove('sent');document.getElementById('msg').style.display='none';document.getElementById('liveMsg').style.display='none';document.getElementById('al').className='light';document.getElementById('st').textContent='OFFLINE';stopMic();};
// CHECK IF HOST ALLOWED - every 1 sec
setInterval(()=>{let want=localStorage.getItem('sirdio_guest_want_air');let allow=localStorage.getItem('sirdio_guest_allowed');if(allow=='1'&&!allowed){allowed=true;document.getElementById('liveMsg').style.display='block';document.getElementById('msg').style.display='none';document.getElementById('al').className='light on';document.getElementById('st').textContent='● ON AIR';document.getElementById('st').style.color='#00ff88';document.getElementById('det').textContent='🔴 YOU ARE ON AIR - Host allowed you!';if(!micOn)toggleMic();}if(!allow&&allowed){allowed=false;document.getElementById('liveMsg').style.display='none';document.getElementById('al').className='light';document.getElementById('st').textContent='OFFLINE';}},800);
// FADER DRAG
let cap=document.getElementById('cap'),fader=document.getElementById('fader'),drag=false,sY=0,sB=70;cap.addEventListener('touchstart',e=>{drag=true;sY=e.touches[0].clientY;sB=parseFloat(cap.style.bottom)||70;e.preventDefault()},{passive:false});cap.addEventListener('mousedown',e=>{drag=true;sY=e.clientY;sB=parseFloat(cap.style.bottom)||70});window.addEventListener('touchmove',e=>{if(!drag)return;let y=e.touches[0].clientY;let db=sY-y;let nb=Math.min(110,Math.max(0,sB+db));cap.style.bottom=nb+'px';let vol=nb/110;if(gainNode)gainNode.gain.value=vol;cap.textContent=Math.round(vol*100)+'%';e.preventDefault()},{passive:false});window.addEventListener('mousemove',e=>{if(!drag)return;let db=sY-e.clientY;let nb=Math.min(110,Math.max(0,sB+db));cap.style.bottom=nb+'px';let vol=nb/110;if(gainNode)gainNode.gain.value=vol;cap.textContent=Math.round(vol*100)+'%'});window.addEventListener('touchend',()=>drag=false);window.addEventListener('mouseup',()=>drag=false);
setInterval(()=>{document.getElementById('t').textContent=new Date().toLocaleTimeString()},1000);
</script></body></html>
