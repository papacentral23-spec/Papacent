<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIRDIO FINAL - NO DELETE</title><script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script><style>body{background:#0a0a0f;color:#fff;font-family:sans-serif;margin:0;padding:8px}header{background:#111;padding:12px;display:flex;justify-content:space-between;border-bottom:2px solid #f00;position:sticky;top:0}#a{display:none;position:fixed;top:0;left:0;right:0;background:#f00;color:#fff;padding:15px;z-index:999;text-align:center}button{padding:12px 10px;margin:4px;background:#222;color:#fff;border:1px solid #555;border-radius:8px;font-weight:bold}button:active{background:#f00}.vu{display:flex;gap:2px;height:50px;background:#000;padding:4px;margin:6px 0}.b{flex:1;background:#0f0;height:10%}#pl{max-height:40vh;overflow:auto;background:#111;padding:5px}.song{padding:10px;border-bottom:1px solid #222}.song.active{background:#f00;color:#fff}</style></head><body>
<div id="a">🔴 GUEST <span id="gn"></span> <button onclick="a.style.display='none';try{client.publish('sirdio/host/guest','YES')}catch(e){}">ACCEPT</button> <button onclick="a.style.display='none'">REJECT</button></div>
<header><div>🔥 SIRDIO </div><div><span id="cs">🟡 Loading...</span> | 👥<b id="lc">0</b></div></header>
<div class="vu" id="vu"></div>
<audio id="p" controls style="width:100%"></audio>
<div style="text-align:center">
<input type="file" id="f" accept="audio/*" multiple hidden>
<button onclick="f.click()">📁 ADD MP3 - SAVES FOREVER</button>
<button onclick="pp()">⏯️ PLAY/PAUSE</button>
<button onclick="nt()">⏭️ NEXT</button>
<button id="mb" onclick="tm()">🎤 MIC OFF</button>
</div>
<div id="pl"></div>
<div style="padding:10px;background:#111;margin-top:6px">Now: <b id="np" style="color:#f00">Nothing</b> <br><small style="color:#0f0">✅ Songs saved in phone - never delete again!</small></div>
<script>
let pl=JSON.parse(localStorage.getItem('sirdio_pl')||'[]'), ci=0, ms=null, client=null;
const p=document.getElementById('p'), vu=document.getElementById('vu'), plDiv=document.getElementById('pl');
for(let i=0;i<18;i++){let d=document.createElement('div');d.className='b';vu.appendChild(d);}
setInterval(()=>{if(!p.paused)for(let c of vu.children)c.style.height=(Math.random()*80+10)+'%';},120);
function save(){localStorage.setItem('sirdio_pl',JSON.stringify(pl.map(x=>({n:x.n}))));}
function render(){plDiv.innerHTML='';pl.forEach((s,i)=>{let d=document.createElement('div');d.className='song'+(i==ci?' active':'');d.textContent='🎵 '+s.n;d.onclick=()=>{ci=i;play();};plDiv.appendChild(d);});}
function play(){if(!pl[ci])return;if(pl[ci].u){p.src=pl[ci].u;}p.play();document.getElementById('np').textContent=pl[ci].n;render();try{if(client&&client.connected)client.publish('sirdio/host/nowplaying',pl[ci].n);}catch(e){}}
function pp(){if(p.paused)p.play();else p.pause();}function nt(){ci++;if(ci>=pl.length)ci=0;play();}
f.onchange=e=>{for(let file of e.target.files){let u=URL.createObjectURL(file);pl.push({n:file.name,u});}render();save();};
async function tm(){let b=document.getElementById('mb');if(ms){ms.getTracks().forEach(t=>t.stop());ms=null;b.textContent='🎤 MIC OFF';b.style.background='#222';return;}try{ms=await navigator.mediaDevices.getUserMedia({audio:true});b.textContent='🔴 MIC ON';b.style.background='#f00';}catch(err){alert('Mic error: '+err.message);}}
// MQTT AUTO 3 BROKERS
let brokers=['wss://broker.hivemq.com:8884/mqtt','wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8000/mqtt'];let idx=0;
function tryConn(){if(idx>=brokers.length){document.getElementById('cs').textContent='🔴 Offline - music still works';return;}
let url=brokers[idx];document.getElementById('cs').textContent='🟡 Try '+(idx+1)+'/3';
let c=mqtt.connect(url,{keepalive:30,connectTimeout:5000});
c.on('connect',()=>{client=c;document.getElementById('cs').textContent='🟢 CONNECTED';c.subscribe('sirdio/guest/request');c.subscribe('sirdio/listener/join');
c.on('message',(t,m)=>{let v=m.toString();if(t.includes('guest')){document.getElementById('gn').textContent=v;document.getElementById('a').style.display='block';}if(t.includes('listener')){document.getElementById('lc').textContent=parseInt(document.getElementById('lc').textContent)+1;}});});
c.on('error',()=>{idx++;tryConn();});c.on('close',()=>{if(!client||!client.connected){idx++;tryConn();}});}
tryConn();
render();
p.onended=()=>nt();
</script></body></html>
