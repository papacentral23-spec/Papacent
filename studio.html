<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIRDIO STUDIO V3</title><style>
body{margin:0;background:#1a0f08;color:#f5e6c8;font-family:monospace;padding-bottom:90px}
.top{padding:10px;background:#000;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #B9FF00;position:sticky;top:0;z-index:9}
.light{width:18px;height:18px;border-radius:50%;background:#333}
.light.on{background:red;box-shadow:0 0 20px red;animation:blink.5s infinite}
@keyframes blink{50%{opacity:.3}}
.console{background:#21160e;padding:10px;border:2px solid #4a3522;border-radius:14px;margin:8px;overflow-x:auto}
.faders{display:flex;gap:8px;min-width:620px}
.chan{width:64px;text-align:center;background:#0f0f0f;border-radius:8px;padding:5px 4px;border:1px solid #2a1f14}
.fader{height:80px;width:34px;background:#000;border-radius:6px;margin:4px auto;position:relative;border:1px solid #333}
.fader-cap{position:absolute;left:3px;right:3px;height:4px;background:#B9FF00;border-radius:2px}
.knob{width:22px;height:22px;background:radial-gradient(#777,#222);border-radius:50%;margin:4px auto;border:1px solid #000}
.label{font-size:8px;font-weight:900}
.btn{background:#B9FF00;color:#000;padding:6px 10px;border-radius:99px;border:0;font-weight:900;font-size:10px;cursor:pointer}
.card{background:#0f0f0f;border-radius:12px;padding:10px;margin:8px;border:1px solid #333}
.playbar{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:2px solid #B9FF00;padding:10px;display:flex;gap:10px;align-items:center;z-index:20}
</style></head><body>
<div class=top><div>● SIRDIO STUDIO</div><div style="display:flex;gap:6px;align-items:center"><span id=t>00:00</span><div id=airlight class=light></div><span style="color:red;font-weight:900;font-size:12px">ON AIR</span></div></div>

<div id=guestAlert style="background:red;color:#fff;padding:10px;border-radius:8px;margin:8px;display:none;text-align:center;font-weight:900">🔴 GUEST WANTS AIR - TAP ALLOW</div>

<div class=console>
<div style="color:#B9FF00;font-size:11px;margin-bottom:6px">ANALOG CONSOLE - 8 CH - KUMASI • SCROLL →</div>
<div class=faders>
<div class=chan><div class=fader><div class=fader-cap style="bottom:25px"></div></div><div class=knob></div><div class=label>HOST</div><div class=label style="color:#B9FF00">●ON</div></div>
<div class=chan><div class=fader><div class=fader-cap style="bottom:50px;background:#888"></div></div><div class=knob></div><div class=label>GUEST</div><button id=allowBtn class=btn>ALLOW</button></div>
<div class=chan><div class=fader><div class=fader-cap style="bottom:15px;background:#ff8800"></div></div><div class=knob></div><div class=label>RODE PRO</div><div class=label style="color:#666">OFF</div></div>
<div class=chan><div class=fader><div class=fader-cap style="bottom:40px;background:#0f8"></div></div><div class=knob></div><div class=label>MUSIC</div></div>
<div class=chan><div class=fader><div class=fader-cap style="bottom:60px;background:#fff"></div></div><div class=knob></div><div class=label>PHONE</div></div>
<div class=chan><div class=fader><div class=fader-cap style="bottom:20px;background:#f0f"></div></div><div class=knob></div><div class=label>SFX</div></div>
<div class=chan><div class=fader><div class=fader-cap style="bottom:35px;background:#0af"></div></div><div class=knob></div><div class=label>AUX</div></div>
<div class=chan style="border-color:#B9FF00"><div class=fader><div class=fader-cap style="bottom:70px"></div></div><div class=knob></div><div class=label>MASTER</div></div>
</div>
</div>

<div class=card>
<div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0;color:#B9FF00;font-size:14px">🎵 PLAYLIST - MP3</h3><label class=btn style="cursor:pointer">📁 + Add MP3<input id=mp3input type=file accept="audio/*" multiple hidden></label></div>
<div id=pl style="margin-top:8px"></div>
<div style="font-size:10px;opacity:.5;margin-top:6px">Tap song to play • Add real MP3 from phone</div>
</div>

<div class=playbar><button id=playBtn style="background:#B9FF00;border:0;width:42px;height:42px;border-radius:50%;font-weight:900">▶</button><div><div id=nowp style="font-size:12px">No track</div><div style="font-size:10px;opacity:.6">SIRDIO Studio Player</div></div><audio id=aud style="display:none" controls></audio></div>

<script>
let tracks=[]; let aud=document.getElementById('aud'); let nowp=document.getElementById('nowp'); let playBtn=document.getElementById('playBtn');
let pl=document.getElementById('pl'); let mp3input=document.getElementById('mp3input');
function render(){pl.innerHTML=tracks.map((t,i)=>`<div style="padding:8px;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center;cursor:pointer" onclick="playT(${i})"><span style="font-size:12px">${i+1}. ${t.name} ${t.playing?'🔊':''}</span><span style="display:flex;gap:6px"><span style="background:#222;padding:2px 6px;border-radius:6px;font-size:10px">${t.size||''}</span><span onclick="event.stopPropagation();tracks.splice(${i},1);render()" style="color:red">✕</span></span></div>`).join('')}
function playT(i){tracks.forEach(x=>x.playing=false);tracks[i].playing=true;aud.src=tracks[i].url;aud.play();nowp.textContent=tracks[i].name;playBtn.textContent='⏸';render()}
playBtn.onclick=()=>{if(aud.paused){aud.play();playBtn.textContent='⏸'}else{aud.pause();playBtn.textContent='▶'}}
mp3input.onchange=e=>{for(let f of e.target.files){let url=URL.createObjectURL(f);tracks.push({name:f.name,size:(f.size/1024/1024).toFixed(1)+'MB',url,playing:false})}render();if(tracks.length)playT(tracks.length-1)}
// default demo tracks
tracks=[{name:"Kumasi Morning Intro.mp3",size:"demo",url:"",playing:false},{name:"Highlife Mix - 6AM.mp3",size:"demo",url:""},{name:"Shatta Wale - On God.mp3",size:"demo",url:""}]; render();
setInterval(()=>{document.getElementById('t').textContent=new Date().toTimeString().slice(0,8)},1000);
let gAlert=document.getElementById('guestAlert'); let light=document.getElementById('airlight');
setInterval(()=>{if(localStorage.getItem('sirdio_guest_want_air')=='1'){gAlert.style.display='block';light.classList.add('on')}else{gAlert.style.display='none';light.classList.remove('on')}},800);
document.getElementById('allowBtn').onclick=gAlert.onclick=()=>{localStorage.setItem('sirdio_guest_allowed','1');localStorage.removeItem('sirdio_guest_want_air');alert('GUEST ALLOWED!')}
document.querySelectorAll('.fader').forEach(f=>{f.onclick=e=>{let cap=f.querySelector('.fader-cap');let r=f.getBoundingClientRect();cap.style.bottom=(f.clientHeight-(e.clientY-r.top))+'px'}})
</script></body></html>
