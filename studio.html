<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIRDIO STUDIO - ABBEY ROAD FULL</title><style>
body{margin:0;background:#1a0f08;color:#f5e6c8;font-family:monospace;padding-bottom:20px}
.top{padding:12px;background:#000;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #B9FF00;position:sticky;top:0;z-index:9}
.light{width:22px;height:22px;border-radius:50%;background:#333;transition:0.2s}
.light.on{background:red;box-shadow:0 0 30px red,0 0 60px red;animation:blink .5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.console{background:linear-gradient(#2a1a0e,#1a0f08);padding:14px;border:2px solid #5a3e2b;border-radius:18px;margin:10px;overflow-x:auto}
.faders{display:flex;gap:14px;min-width:680px}
.chan{width:72px;text-align:center;background:#0f0f0f;border-radius:10px;padding:8px 6px;border:1px solid #332211}
.fader{height:130px;width:44px;background:#000;border-radius:8px;margin:6px auto;position:relative;border:1px solid #444;cursor:pointer}
.fader-cap{position:absolute;left:4px;right:4px;height:6px;background:#B9FF00;border-radius:2px;box-shadow:0 0 8px #B9FF00}
.knob{width:32px;height:32px;background:radial-gradient(#888,#222);border-radius:50%;margin:6px auto;border:2px solid #000;position:relative}
.knob:after{content:'';position:absolute;top:3px;left:50%;width:2px;height:10px;background:#B9FF00;transform:translateX(-50%)}
.label{font-size:10px;font-weight:900;margin-top:4px}
.vu{height:6px;background:#222;border-radius:3px;margin:4px 0;overflow:hidden}
.vu-bar{height:100%;width:30%;background:linear-gradient(90deg,#0f0,#B9FF00,#f00)}
.btn{background:#B9FF00;color:#000;padding:8px 14px;border-radius:99px;border:0;font-weight:900;cursor:pointer;font-size:11px}
.btn-red{background:red;color:#fff}
.card{background:#0f0f0f;border-radius:14px;padding:12px;margin:10px;border:1px solid #333}
</style></head><body>
<div class=top><div>●  - SIRDIO STUDIO</div><div style="display:flex;gap:8px;align-items:center"><span id=t>00:00</span><div id=airlight class=light></div><span style="color:red;font-weight:900">ON AIR</span></div></div>

<div id=guestAlert style="background:red;color:#fff;padding:14px;border-radius:12px;margin:10px;display:none;font-weight:900;text-align:center">🔴 GUEST WANTS AIR - TAP TO ALLOW MIC</div>

<div class=console>
<h3 style="margin:0 0 10px;color:#B9FF00">ANALOG 
  
  
  - 8 CH</h3>
<div class=faders>
<div class=chan><div class=vu><div class=vu-bar style="width:75%"></div></div><div class=fader><div class=fader-cap style="bottom:30px"></div></div><div class=knob></div><div class=knob style="width:24px;height:24px"></div><div class=label>HOST MIC</div><div class=label style="color:#B9FF00">● ON</div></div>
<div class=chan><div class=vu><div class=vu-bar style="width:45%"></div></div><div class=fader><div class=fader-cap style="bottom:60px;background:#888"></div></div><div class=knob></div><div class=knob style="width:24px;height:24px"></div><div class=label>GUEST MIC</div><button id=allowBtn class=btn style="margin-top:6px">ALLOW</button></div>
<div class=chan><div class=vu><div class=vu-bar style="width:20%"></div></div><div class=fader><div class=fader-cap style="bottom:20px;background:#ff8800"></div></div><div class=knob></div><div class=knob style="width:24px;height:24px"></div><div class=label>RODE PRO</div><div class=label style="color:#888">● OFF</div></div>
<div class=chan><div class=vu><div class=vu-bar style="width:60%"></div></div><div class=fader><div class=fader-cap style="bottom:45px;background:#00ff88"></div></div><div class=knob></div><div class=knob style="width:24px;height:24px"></div><div class=label>MUSIC</div><div class=label>STEREO</div></div>
<div class=chan><div class=vu><div class=vu-bar style="width:90%"></div></div><div class=fader><div class=fader-cap style="bottom:80px;background:#fff"></div></div><div class=knob></div><div class=knob style="width:24px;height:24px"></div><div class=label>PHONE</div><div class=label>CALL-IN</div></div>
<div class=chan><div class=vu><div class=vu-bar style="width:35%"></div></div><div class=fader><div class=fader-cap style="bottom:25px;background:#ff00ff"></div></div><div class=knob></div><div class=knob style="width:24px;height:24px"></div><div class=label>SFX</div><div class=label>JINGLES</div></div>
<div class=chan><div class=vu><div class=vu-bar style="width:55%"></div></div><div class=fader><div class=fader-cap style="bottom:50px;background:#00aaff"></div></div><div class=knob></div><div class=knob style="width:24px;height:24px"></div><div class=label>AUX 1</div><div class=label>BT</div></div>
<div class=chan style="border-color:#B9FF00"><div class=vu><div class=vu-bar style="width:85%;background:#B9FF00"></div></div><div class=fader style="border-color:#B9FF00"><div class=fader-cap style="bottom:90px"></div></div><div class=knob style="border-color:#B9FF00"></div><div class=knob style="width:24px;height:24px"></div><div class=label>MASTER</div><div class=label style="color:#B9FF00">● LIVE</div></div>
</div>
<div style="margin-top:12px;font-size:10px;opacity:.5">← SCROLL → 8 CHANNELS EMI TG12345 • </div>
</div>

<div class=card><h3 style="margin:0;color:#B9FF00">🎵 PLAYLIST - 24/7</h3><div id=pl style="margin-top:8px"></div><button class=btn onclick="addTrack()" style="margin-top:10px">+ Add Track</button></div>

<script>
let tracks=["Kumasi Morning Intro","Highlife Mix - 6AM","News Jingle","Shatta Wale - On God","Black Sherif - Soja","Amapiano Live","Callers Hour"];
function render(){document.getElementById('pl').innerHTML=tracks.map((t,i)=>`<div style="padding:8px;border-bottom:1px solid #222;display:flex;justify-content:space-between"><span>${i+1}. ${t}</span><span onclick="tracks.splice(${i},1);render()" style="color:red;cursor:pointer">✕</span></div>`).join('')}
function addTrack(){let n=prompt('Track name:');if(n){tracks.push(n);render()}} render();
setInterval(()=>{let d=new Date();document.getElementById('t').textContent=d.toTimeString().slice(0,8)},1000);
let gAlert=document.getElementById('guestAlert'); let light=document.getElementById('airlight');
function checkGuest(){let want=localStorage.getItem('sirdio_guest_want_air');if(want=='1'){gAlert.style.display='block';light.classList.add('on')}else{gAlert.style.display='none';light.classList.remove('on');}} setInterval(checkGuest,800);
document.getElementById('allowBtn').onclick=gAlert.onclick=()=>{localStorage.setItem('sirdio_guest_allowed','1');localStorage.removeItem('sirdio_guest_want_air');alert('GUEST ALLOWED! Rode Pro ON!');checkGuest()}
document.querySelectorAll('.fader').forEach(f=>{f.onclick=e=>{let cap=f.querySelector('.fader-cap');let rect=f.getBoundingClientRect();let y=e.clientY-rect.top;cap.style.bottom=(f.clientHeight-y)+'px'}})
</script></body></html>
